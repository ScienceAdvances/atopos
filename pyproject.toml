[project]
name = "atopos"
dynamic = ["version"]
description = "Fonts, themes, palettes, and unified figure export for scientific workflows"
authors = [{ name = "生信探索 BioQuest", email = "yehior@qq.com" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["matplotlib>=3.7.5"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.8", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/ScienceAdvances/atopos"
Issues = "https://github.com/ScienceAdvances/atopos/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "atopos/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["atopos"]

[tool.hatch.build.targets.sdist]
include = ["/atopos", "/tests", "/examples", "/README.md", "/CHANGELOG.md", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
