name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.9'
            matplotlib: 'matplotlib==3.7.5'
          - python: '3.12'
            matplotlib: 'matplotlib>=3.7.5'
          - python: '3.14'
            matplotlib: 'matplotlib>=3.7.5'
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]' '${{ matrix.matplotlib }}'
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m build
      - name: Test the installed wheel outside the source directory
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -m pytest "$GITHUB_WORKSPACE/tests"
